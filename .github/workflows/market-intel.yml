name: 外資動向與新聞情緒

on:
  schedule:
    # 台灣時間週一至週五 17:47：證交所、櫃買中心公布外資買賣超後（含新聞）
    - cron: '47 9 * * 1-5'
    # 台灣時間每天 08:17：以最新新聞與前一交易日外資資料更新觀察名單
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'analysis/**'
      - 'requirements.txt'
      - '.github/workflows/market-intel.yml'

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 第一次執行需回補 60 個交易日的外資與收盤價（約 15 分鐘），之後由快取延續
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      # 保留 SQLite（外資、收盤價歷史）供回測；快取遺失時會自動重新回補
      - uses: actions/cache@v4
        with:
          path: data/market.db
          # v2：舊快取含有日期錯誤的上櫃收盤價，改用新的快取鍵重新回補
          key: market-db-v2-${{ github.run_id }}
          restore-keys: market-db-v2-
      - run: python -m pytest -q analysis/tests
      - name: 抓取並分析
        env:
          # 選用：在 Settings → Secrets 設定 ANTHROPIC_API_KEY 後改用 Claude 分析新聞情緒
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m analysis.pipeline
      - name: 提交更新的資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/foreign.json data/news.json data/recommend.json data/backtest.json data/recommend_history.json
          if git diff --cached --quiet; then
            echo "資料沒有變化"; exit 0
          fi
          git commit -m "Update foreign investor, news and watchlist data"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
