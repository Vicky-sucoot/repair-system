name: probe trust sources
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe-trust.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          UA = 'Mozilla/5.0 (compatible; tw-market-intel/1.0)'
          def get(url):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': UA}), timeout=30)
                  return r.status, r.read().decode('utf-8', 'replace')
              except Exception as e:
                  return 'ERR', str(e)
          for url in ['https://www.twse.com.tw/rwd/zh/fund/TWT44U?date=20261116&response=json',
                      'https://www.tpex.org.tw/web/stock/3insti/sitc_trading/sitctr_result.php?l=zh-tw&t=D&type=buy&d=115/11/16',
                      'https://www.tpex.org.tw/web/stock/3insti/sitc_trading/sitctr_result.php?l=zh-tw&t=D&type=sell&d=115/11/16',
                      'https://www.tpex.org.tw/www/zh-tw/insti/sitcTrading?type=buy&date=2026/11/16&response=json',
                      'https://www.tpex.org.tw/openapi/v1/tpex_3insti_trading']:
              st, txt = get(url)
              print('=====', url, st, len(txt))
              try:
                  d = json.loads(txt)
                  if isinstance(d, list):
                      print('list', len(d), json.dumps(d[0], ensure_ascii=False)[:500])
                  else:
                      print('keys', list(d.keys()), 'stat', d.get('stat'), 'title', d.get('title'))
                      print('fields', d.get('fields'))
                      if d.get('data'): print('row0', d['data'][0], 'n', len(d['data']))
                      for tb in d.get('tables') or []:
                          print('table', tb.get('title'), tb.get('date'), tb.get('fields'), 'n', len(tb.get('data') or []))
                          if tb.get('data'): print('  row0', tb['data'][0])
              except Exception as e:
                  print('not json', txt[:300])
          PY
