name: probe pipeline
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - run: python -m pytest -q analysis/tests
      - run: python -m analysis.pipeline --days 6
      - run: |
          python - <<'PY'
          import json
          f = json.load(open('data/foreign.json'))
          print('FOREIGN', f['date'], f['dates'], f['counts'])
          for k in ('streaks', 'big_buys', 'big_sells'):
              print(k, [(s['code'], s['name'], s['net_lots'], s['net_value'], s['streak_days'], s['is_big'] if 'is_big' in s else '') for s in f[k][:8]])
          n = json.load(open('data/news.json'))
          print('NEWS', n['counts'], n['analyzer'], len(n['items']))
          from collections import Counter
          print('by source', Counter(i['source'] for i in n['items']))
          for i in n['items'][:25]:
              print(i['sentiment'], i['score'], i['source'], i['published_at'], i['title'][:40], i['bullish_keywords'], i['bearish_keywords'], [s['code'] + s['name'] for s in i['stocks']], i['tags'])
          print('STOCKS', [(s['code'], s['name'], s['bullish'], s['bearish'], s['neutral']) for s in n['stocks'][:15]])
          PY
