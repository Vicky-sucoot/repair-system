name: probe backtest v2
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - run: python -m pytest -q analysis/tests
      - run: BACKTEST_DAYS=30 python -m analysis.pipeline --skip-news
      - run: |
          python - <<'PY'
          import json, sqlite3
          con = sqlite3.connect('data/market.db')
          print('price rows per date', con.execute("select date, count(*) from prices group by date order by date desc limit 4").fetchall())
          print('1815 closes', con.execute("select date, close from prices where code='1815' order by date desc limit 5").fetchall())
          b = json.load(open('data/backtest.json'))
          print('PRICE DAYS', b['price_days'], b['price_range'])
          r = b['foreign_only']
          print('foreign_only days', r['days'], 'picks', r['picks'])
          for side in ('buy', 'sell'):
              print(side, json.dumps(r['summary'][side], ensure_ascii=False))
          PY
