name: probe sox gold
on:
  push:
    branches: [claude/affectionate-volta-na1we6]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36'
          for u in https://ws.api.cnyes.com/robots.txt https://invest.cnyes.com/robots.txt; do
            echo "=== $u"; curl -sS -m 20 -A "$UA" -o /tmp/r -w 'HTTP %{http_code}\n' "$u"; head -c 600 /tmp/r; echo; done
          T=$(date +%s); F=$((T-86400*10))
          for s in GF:GCCOMEX:FUTURES GF:GC:FUTURES FX:XAU:FOREX FX:XAUUSD:CURRENCY CM:GC:COMMODITY GI:GOLD:INDEX FX:XAUUSDX:FOREX GF:GCZ26:FUTURES; do
            u="https://ws.api.cnyes.com/ws/api/v1/charting/history?symbol=$s&resolution=D&quote=1&from=$T&to=$F"
            echo "=== $s"; curl -sS -m 20 -A "$UA" "$u" | head -c 700; echo; done
          for p in futures/GF/GCCOMEX forex/detail/XAUUSD; do echo "=== page $p"; curl -sS -m 20 -A "$UA" "https://invest.cnyes.com/$p" | grep -o '[A-Z]\{2,3\}:[A-Z0-9]\{2,12\}:[A-Z]\{4,9\}' | sort -u | head; done
