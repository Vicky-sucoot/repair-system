name: probe pipeline
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - run: python -m pytest -q analysis/tests
      - run: python -m analysis.pipeline --days 6
      - run: |
          python - <<'PY'
          import json
          r = json.load(open('data/recommend.json'))
          print('DATE', r['date'], 'candidates', r['candidates'])
          for k in ('buy', 'sell'):
              print('==', k)
              for c in r[k]:
                  print(c['score'], c['foreign_score'], c['news_score'], c['code'], c['name'], c['reason'], [h['title'][:30] for h in c['headlines'][:2]])
          PY
