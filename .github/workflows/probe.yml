name: probe global pipeline
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - run: python -m pytest -q analysis/tests
      - run: |
          python - <<'PY'
          import json, time
          from analysis.crawlers import global_quotes
          t = time.time()
          uni = global_quotes.universe()
          print('universe', len(uni), {m: sum(1 for u in uni if u['market'] == m) for m in ('US', 'JP')}, round(time.time() - t, 1), 's')
          t = time.time()
          q = global_quotes.fetch_quotes(uni)
          print('quotes', len(q), {m: sum(1 for x in q if x['market'] == m) for m in ('US', 'JP')}, round(time.time() - t, 1), 's')
          by = {x['code']: x for x in q}
          for c in ('AAPL', 'NVDA', 'BRK-B', 'VOO', 'TSM', '7203.T', '6758.T', '285A.T', '1321.T', '2558.T'):
              print(c, by.get(c))
          print('dates', sorted({(x['market'], x['date']) for x in q}))
          PY
