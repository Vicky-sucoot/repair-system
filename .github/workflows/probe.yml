name: probe tpex history
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          UA = 'Mozilla/5.0 (compatible; tw-market-intel/1.0)'
          def req(url, data=None):
              r = urllib.request.Request(url, data=urllib.parse.urlencode(data).encode() if data else None, headers={'User-Agent': UA})
              return urllib.request.urlopen(r, timeout=30).read().decode('utf-8', 'replace')
          tries = [
            ('GET', 'https://www.tpex.org.tw/web/stock/aftertrading/daily_close_quotes/stk_quote_result.php?l=zh-tw&o=json&d=115/10/01&s=0,asc,0', None),
            ('GET', 'https://www.tpex.org.tw/web/stock/aftertrading/otc_quotes_no1430/stk_wn1430_result.php?l=zh-tw&o=json&d=115/10/01&se=EW&s=0,asc,0', None),
            ('GET', 'https://www.tpex.org.tw/www/zh-tw/afterTrading/otc?date=2026%2F10%2F01&type=EW&response=json', None),
            ('POST', 'https://www.tpex.org.tw/www/zh-tw/afterTrading/otc', {'date': '2026/10/01', 'type': 'EW', 'response': 'json'}),
            ('POST', 'https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQ', {'date': '2026/10/01', 'response': 'json'}),
          ]
          for m, url, data in tries:
              print('=====', m, url, data)
              try:
                  t = req(url, data if m == 'POST' else None)
                  j = json.loads(t)
                  print('top keys', list(j.keys())[:10], 'date', j.get('date') or j.get('reportDate'))
                  for tb in (j.get('tables') or [])[:2]:
                      rows = tb.get('data') or []
                      print(' table', tb.get('title'), tb.get('date'), 'fields', (tb.get('fields') or [])[:4], 'n', len(rows))
                      look = {r[0]: r[2] for r in rows if r and r[0] in ('1815', '6147', '5347')}
                      print('  sample', look)
                  if j.get('aaData'): print(' aaData', len(j['aaData']), j['aaData'][0][:4])
              except Exception as e:
                  print('ERR', type(e).__name__, str(e)[:120])
          PY
