name: probe sox gold
on:
  push:
    branches: [claude/affectionate-volta-na1we6]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - run: node scripts/fetch-prices.mjs
      - run: |
          node -e "
          const d = require('./data/prices.json');
          console.log(d.source);
          const s = d.indices.SOX; console.log('SOX', s.source, s.dates.length, s.dates.slice(-3), s.close.slice(-3));
          console.log('GOLD', JSON.stringify(d.indices.GOLD.series.slice(-3)));
          for (const k of ['0050.TW', 'VOO', 'TWD=X']) console.log(k, d.symbols[k].source, d.symbols[k].dates.at(-1));
          console.log('TWII', d.indices.TWII.dates.at(-1), 'NIGHT', d.indices.TX_NIGHT.series.at(-1).date);
          "
