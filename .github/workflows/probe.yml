name: probe quote fields
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          UA = 'Mozilla/5.0 (compatible; tw-market-intel/1.0)'
          for url in ['https://www.tpex.org.tw/openapi/v1/tpex_mainboard_quotes', 'https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL']:
              d = json.loads(urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': UA}), timeout=60).read())
              print(url, len(d))
              print(json.dumps(d[0], ensure_ascii=False))
              print(json.dumps([x for x in d if (x.get('SecuritiesCompanyCode') or x.get('Code')) in ('1815', '2330', '0050')], ensure_ascii=False)[:800])
          PY
