name: probe global quotes
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas lxml requests
      - run: |
          python - <<'PY'
          import io, json, requests, pandas as pd
          UA = {'User-Agent': 'Mozilla/5.0 (compatible; tw-market-intel/1.0)'}
          for name, url in [('sp500', 'https://en.wikipedia.org/wiki/List_of_S%26P_500_companies'),
                            ('ndx', 'https://en.wikipedia.org/wiki/Nasdaq-100'),
                            ('n225', 'https://en.wikipedia.org/wiki/Nikkei_225')]:
              try:
                  html = requests.get(url, headers=UA, timeout=30).text
                  tables = pd.read_html(io.StringIO(html))
                  print('==', name, 'tables', len(tables))
                  for i, t in enumerate(tables[:8]):
                      print('  ', i, t.shape, list(t.columns)[:6])
                      if len(t) > 50: print('     head', t.head(2).values.tolist())
              except Exception as e:
                  print('ERR', name, e)
          syms = 'AAPL,MSFT,NVDA,VOO,QQQ,7203.T,6758.T,1321.T,^N225,^GSPC'
          for url in [f'https://query1.finance.yahoo.com/v7/finance/spark?symbols={syms}&range=5d&interval=1d',
                      f'https://query1.finance.yahoo.com/v8/finance/spark?symbols={syms}&range=5d&interval=1d',
                      f'https://query1.finance.yahoo.com/v7/finance/quote?symbols={syms}']:
              r = requests.get(url, headers=UA, timeout=30)
              print('==', url[:70], r.status_code, r.text[:700])
          r = requests.get('https://query1.finance.yahoo.com/v8/finance/chart/7203.T?range=5d&interval=1d', headers=UA, timeout=30)
          m = r.json()['chart']['result'][0]['meta']
          print('chart meta', {k: m.get(k) for k in ('symbol', 'currency', 'regularMarketPrice', 'chartPreviousClose', 'previousClose', 'longName', 'shortName', 'regularMarketTime', 'exchangeTimezoneName')})
          PY
