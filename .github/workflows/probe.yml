name: probe fetch script
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - run: node scripts/fetch-prices.mjs
      - run: node -e "const d=require('./data/prices.json');console.log(JSON.stringify(d.indices.TWII?.dates?.slice(-3)), JSON.stringify(d.indices.TWII?.close?.slice(-3)));console.log(JSON.stringify(d.indices.TX_NIGHT?.series?.slice(-3)))"
