name: probe fx and voo
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse
          UA = 'Mozilla/5.0 (compatible; tw-market-intel/1.0)'
          def get(url, data=None, t=60):
              try:
                  body = urllib.parse.urlencode(data).encode() if data else None
                  r = urllib.request.urlopen(urllib.request.Request(url, data=body, headers={'User-Agent': UA}), timeout=t)
                  raw = r.read()
                  for enc in ('utf-8', 'big5', 'cp950'):
                      try: return r.status, raw.decode(enc)
                      except UnicodeDecodeError: pass
                  return r.status, raw.decode('utf-8', 'replace')
              except Exception as e:
                  return 'ERR', str(e)
          tries = [
            ('GET', 'https://fred.stlouisfed.org/graph/fredgraph.csv?id=DEXTAUS', None),
            ('GET', 'https://www.taifex.com.tw/cht/3/dailyFXRate', None),
            ('POST', 'https://www.taifex.com.tw/cht/3/dailyFXRateDown', {'queryStartDate': '2026/11/01', 'queryEndDate': '2026/11/17'}),
            ('POST', 'https://www.taifex.com.tw/cht/3/dailyFXRateDown', {'queryStartDate': '2010/09/01', 'queryEndDate': '2010/09/30'}),
            ('GET', 'https://investor.vanguard.com/investment-products/etfs/profile/api/VOO/price', None),
            ('GET', 'https://investor.vanguard.com/investment-products/etfs/profile/api/VOO/price-history', None),
            ('GET', 'https://investor.vanguard.com/investment-products/etfs/profile/api/VOO/distribution', None),
            ('GET', 'https://investor.vanguard.com/investment-products/etfs/profile/voo', None),
          ]
          for m, url, data in tries:
              st, txt = get(url, data if m == 'POST' else None)
              print('=====', m, url, data, st, len(txt))
              lines = txt.splitlines()
              print('\n'.join(lines[:6])[:900]); print('...', '\n'.join(lines[-3:])[:400])
          PY
