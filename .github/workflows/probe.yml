name: probe backtest
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - run: python -m pytest -q analysis/tests
      - run: time python -m analysis.pipeline
      - run: |
          python - <<'PY'
          import json
          b = json.load(open('data/backtest.json'))
          print('PRICE DAYS', b['price_days'], b['price_range'])
          for k in ('foreign_only', 'combined'):
              r = b[k]
              print('==', k, 'days', r['days'], r['first_date'], r['last_date'], 'picks', r['picks'])
              for side in ('buy', 'sell'):
                  print(side, json.dumps(r['summary'][side], ensure_ascii=False))
              print('recent', [(p['date'], p['side'], p['name'], p['r1'], p['r5']) for p in r['recent'][:6]])
          PY
