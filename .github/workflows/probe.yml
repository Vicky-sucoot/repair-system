name: probe stooq
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request, urllib.robotparser
          UA = 'Mozilla/5.0 (compatible; tw-market-intel/1.0)'
          def get(url):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': UA}), timeout=30)
                  return r.status, r.read().decode('utf-8', 'replace')
              except Exception as e:
                  return 'ERR', str(e)
          for host in ('stooq.com', 'query1.finance.yahoo.com', 'query2.finance.yahoo.com'):
              st, txt = get(f'https://{host}/robots.txt')
              print('== robots', host, st); print(txt[:600])
              rp = urllib.robotparser.RobotFileParser(); rp.parse(txt.splitlines())
              for path in ('/q/l/', '/q/d/l/', '/v7/finance/spark', '/v8/finance/chart/VOO'):
                  print('   can_fetch', path, rp.can_fetch(UA, f'https://{host}{path}'))
          for url in ['https://stooq.com/q/l/?s=aapl.us+voo.us+brk-b.us+7203.jp+1321.jp&f=sd2t2ohlcpv&h&e=csv',
                      'https://stooq.com/q/l/?s=aapl.us,voo.us,7203.jp&f=sd2t2ohlcpvn&h&e=csv',
                      'https://stooq.com/q/d/l/?s=7203.jp&i=d']:
              st, txt = get(url); print('==', url, st); print(txt[:500])
          PY
