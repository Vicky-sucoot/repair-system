name: probe new price sources
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cp data/prices.json /tmp/old.json
      - run: time node scripts/fetch-prices.mjs
      - run: |
          node -e "
          const o = require('/tmp/old.json'), n = require('./data/prices.json');
          console.log('source:', n.source);
          for (const k of ['0050.TW', 'VOO', 'TWD=X']) {
            const a = o.symbols[k], b = n.symbols[k];
            console.log(k, b.source, 'n', b.dates.length, b.dates[0], '->', b.dates.at(-1), 'last', b.close.at(-1), '| old n', a.dates.length, 'last', a.close.at(-1));
            for (const d of ['2010-09-10', '2015-06-01', '2020-03-19', '2025-06-10', '2025-06-18', '2026-11-13']) {
              const ia = a.dates.indexOf(d), ib = b.dates.indexOf(d);
              console.log('   ', d, 'old', ia >= 0 ? a.close[ia] : '-', 'new', ib >= 0 ? b.close[ib] : '-');
            }
            if (b.dividends.length) console.log('   div new', b.dividends.length, JSON.stringify(b.dividends.slice(-4)), '| old', a.dividends.length, JSON.stringify(a.dividends.slice(-4)));
            if (b.splits) console.log('   splits', JSON.stringify(b.splits));
          }
          const t = n.indices.TWII; console.log('TWII', t.source, t.dates.length, t.dates.at(-1), t.close.at(-1));
          console.log('NIGHT', JSON.stringify(n.indices.TX_NIGHT.series.at(-1)));
          "
          echo '--- second run (incremental) ---'
          time node scripts/fetch-prices.mjs
