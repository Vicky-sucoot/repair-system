  <title>目前離線｜報修登記</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header><span class="eyebrow">REPAIR DESK</span><h1>目前無法連線</h1></header>
    <section class="panel">
      <h2>請連線後再登記報修</h2>
      <p>這是離線說明頁，沒有送出任何報修。離線時無法讀取最近清單，也不會暫存或自動補送資料。</p>
      <p>連線後可填寫報修人、地點或部門、類別、問題說明與緊急程度，再按「送出報修」。清單提供最近 20 筆及緊急程度篩選。</p>
      <p class="hint">請勿填入密碼、電話或其他私人資訊；清單為公開資訊。</p>
      <p><a href="./index.html">已恢復連線？重新開啟報修登記</a></p>
    </section>
  </main>
</body>
</html>
