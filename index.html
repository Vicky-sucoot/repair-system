<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#155e59">
  <title>報修登記</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script defer src="./config.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <main>
    <header><span class="eyebrow">REPAIR DESK</span><h1>報修登記</h1><p>發現問題，留下紀錄，讓處理更有條理。</p></header>
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">新增報修</h2>
      <p class="hint">以下欄位皆為必填。清單為公開資訊，請勿填入電話、密碼或其他敏感資料。</p>
      <form id="repair-form">
        <div class="grid">
          <label>報修人<input name="reporter_name" required maxlength="100" autocomplete="off" placeholder="請輸入稱呼"></label>
          <label>地點或部門<input name="location" required maxlength="200" placeholder="例如：示範會議室"></label>
          <label>類別<select name="category" required><option value="" disabled selected>請選擇類別</option><option>設備</option><option>網路</option><option>環境</option><option>其他</option></select></label>
          <label>緊急程度<select name="urgency" required><option>低</option><option selected>中</option><option>高</option></select></label>
        </div>
        <label>問題說明<textarea name="description" required maxlength="2000" rows="4" placeholder="請描述問題與發生情況"></textarea></label>
        <button id="submit-button" type="submit" disabled>送出報修</button>
        <p id="form-message" role="status" aria-live="polite"></p>
      </form>
      <noscript>請啟用 JavaScript，才能送出及讀取報修資料。</noscript>
    </section>
    <section class="panel" aria-labelledby="list-title">
      <div class="section-heading"><div><h2 id="list-title">最近報修</h2><p class="hint">最近 20 筆 · 最新的在上方</p></div><button id="refresh-button" class="secondary" type="button" disabled>重新整理</button></div>
      <p id="list-message" role="status" aria-live="polite">準備載入清單…</p>
      <ol id="request-list" aria-label="最近報修清單"></ol>
    </section>
    <footer>一起讓工作環境更好。</footer>
  </main>
</body>
</html>
